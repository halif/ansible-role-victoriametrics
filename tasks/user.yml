---
- name: Create group for VictoriaMetrics service user
  ansible.builtin.group:
    name: "{{ victoriametrics_system_groupname }}"
    system: true
    state: present

- name: Create VictoriaMetrics service user
  ansible.builtin.user:
    name: "{{ victoriametrics_system_username }}"
    group: "{{ victoriametrics_system_groupname }}"
    comment: "System user for VictoriaMetrics"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create directories for install and storage
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    owner: "{{ victoriametrics_system_username }}"
    group: "{{ victoriametrics_system_groupname }}"
    mode: '0750'
  loop:
    - "{{ victoriametrics_storage_dir }}"
    - "{{ victoriametrics_install_dir }}"
